name: figure3_eta_fiber
base:
  protocol: ablation
  optimizer: rlo_lifted
  field: tanh
  use_global_norm: true
  lr: 3.0e-5
  weight_decay: 0.1
  lambda_b: 0.2
  gamma: 5.0
  betas: [0.9, 0.99]
  seed: 42
  epochs: 50
  batch_size: 128
  collect_diagnostics: true
  name_keys: [eta]
grid:
  eta: [0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
