name: table11_gpt2_adamw
base:
  optimizer: adamw
  weight_decay: 0.1
  betas: [0.9, 0.95]
  max_steps: 10000
  batch_size: 12
  grad_accum: 40
  min_lr_ratio: 0.1
  grad_clip: 1.0
  eval_mode: fixed
  eval_interval: 250
  eval_iters: 100
  warmup_indexing: exact
  seed: 1337
  data_seed: 1337
  name_keys: [optimizer, lr, warmup_steps]
grid:
  lr: [1.0e-4, 3.0e-4, 6.0e-4]
  warmup_steps: [2000, 4000]
