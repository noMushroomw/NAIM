name: table8_factorial
base:
  protocol: ablation
  optimizer: rlo_lifted
  field: tanh
  weight_decay: 0.1
  lambda_b: 0.2
  gamma: 5.0
  betas: [0.9, 0.99]
  seed: 42
  epochs: 50
  batch_size: 128
  name_keys: [eta, use_global_norm, lr]
runs:
  - {eta: 0.7, use_global_norm: true, lr: 3.0e-5}
  - {eta: 0.7, use_global_norm: false, lr: 3.0e-3}
  - {eta: 1.0, use_global_norm: true, lr: 3.0e-5}
  - {eta: 1.0, use_global_norm: false, lr: 3.0e-3}
